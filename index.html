<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RandPicker & TimeCalc - Tools Suite</title>
    <meta name="description" content="A professional random number generator, spin wheel, and time calculator.">
    
    <!-- FAVICON -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
    
    <!-- FONT: Inter for UI, JetBrains Mono for Numbers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">

    <style>
        /* * 🎨 THEME CONFIGURATION */
        :root {
            --bg-body: #e2e8f0; 
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-error: #ef4444;
            --text-warning: #d97706;
            
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            
            --border: #cbd5e1; 
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-warning: #fbbf24;
            
            --primary: #6366f1; 
            --primary-hover: #818cf8;
            --primary-light: #312e81;
            
            --border: #334155;
            --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.5);
        }

        /* RESET & BASE */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* LAYOUT */
        .app-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* MAIN CARD */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-dot { color: var(--primary); }
        
        .controls-top { display: flex; gap: 0.5rem; }
        
        .btn-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s var(--transition);
        }
        .btn-icon:hover { background: var(--bg-input); color: var(--primary); border-color: var(--primary); }
        .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }

        /* SEGMENTED TABS */
        .tabs-container {
            background: var(--bg-input);
            padding: 5px;
            border-radius: var(--radius-md);
            display: flex;
            margin-bottom: 2rem;
            position: relative;
            border: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: var(--radius-sm);
            z-index: 2;
            transition: color 0.3s ease;
        }
        .tab-btn:disabled { cursor: not-allowed; opacity: 0.5; }
        .tab-btn.active { color: var(--text-main); }
        
        .tab-indicator {
            position: absolute;
            top: 5px; left: 5px;
            width: calc(33.33% - 6.5px);
            height: calc(100% - 10px);
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }
        [data-mode="normal"] .tab-indicator { transform: translateX(0%); }
        [data-mode="wheel"] .tab-indicator { transform: translateX(100%); }
        [data-mode="time"] .tab-indicator { transform: translateX(200%); }
        
        /* INPUT AREA */
        .config-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-mode-switch {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: -10px;
        }
        .link-btn {
            background: none; border: none; padding: 0;
            color: var(--text-muted); cursor: pointer; text-decoration: underline;
            font-weight: 600;
        }
        .link-btn:hover { color: var(--primary); }
        .link-btn.active { color: var(--primary); text-decoration: none; cursor: default; }
        .link-btn:disabled { cursor: not-allowed; opacity: 0.5; color: var(--text-muted); }

        .inputs-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .input-wrapper {
            position: relative;
        }
        
        .input-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: block;
        }

        .input-field {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            font-size: 1.1rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
            transition: all 0.2s ease;
        }
        .input-field:focus {
            outline: none;
            background: var(--bg-card);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }
        .input-field:disabled { opacity: 0.6; cursor: not-allowed; }
        .input-field.error {
            border-color: var(--text-error);
            background: rgba(239, 68, 68, 0.05);
        }

        /* TEXTAREA FOR ADVANCED MODE */
        textarea.input-field {
            min-height: 100px;
            text-align: left;
            resize: vertical;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        /* CHECKBOX TOGGLE */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
            padding: 5px 0;
        }
        .checkbox-wrapper input {
            width: 18px; height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Error Message */
        .msg-box {
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .error-msg {
            color: var(--text-error);
            background: rgba(239, 68, 68, 0.1);
        }
        /* Warning Message */
        .warning-msg {
            color: var(--text-warning);
            background: rgba(245, 158, 11, 0.1);
        }

        /* PRESETS (Chips) */
        .presets-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }
        .chip {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .chip:hover { background: var(--border); color: var(--text-main); }
        .chip.active {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
        }
        .chip.disabled { opacity: 0.5; pointer-events: none; }

        /* ACTION AREA */
        .action-area {
            margin-top: 2rem;
            text-align: center;
        }

        /* RESULT DISPLAY */
        .result-box {
            background: var(--bg-input);
            border-radius: var(--radius-md);
            padding: 2rem 1rem;
            margin-bottom: 1.5rem;
            position: relative;
            border: 1px solid var(--border);
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .result-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .result-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
            word-break: break-all;
        }

        /* BUTTONS */
        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
            transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 15px -3px rgba(79, 70, 229, 0.4); }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; background: var(--text-muted); }
        
        /* WHEEL SPECIFIC */
        .wheel-stage {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 1.5rem auto;
        }
        
        .wheel-svg {
            width: 100%; height: 100%;
            border-radius: 50%;
            box-shadow: var(--shadow-lg), inset 0 0 0 8px rgba(255,255,255,0.2);
            transform: rotate(-90deg); /* Start at 12 o'clock visually */
        }
        
        .pointer {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 24px; height: 32px;
            z-index: 10;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }
        .wheel-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            background: var(--bg-card);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 5;
            display: grid;
            place-items: center;
            font-weight: 800;
            color: var(--primary);
            border: 4px solid var(--bg-body);
        }
        
        /* Speed Controls */
        .speed-control-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .speed-options {
            display: flex;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px;
            gap: 4px;
        }
        .speed-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .speed-btn:disabled { cursor: not-allowed; opacity: 0.5; }
        .speed-btn.active {
            background: var(--bg-card);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* ALERTS */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-main);
            color: var(--bg-card);
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* HIDE/SHOW SECTIONS */
        .hidden { display: none !important; }
        
        /* ANIMATIONS */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .anim-pop { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

    </style>
</head>
<body>

<div class="app-wrapper">
    
    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <span>RandPicker</span><span class="brand-dot">& TimeCalc</span>
        </div>
        <div class="controls-top">
            <button class="btn-icon" id="btn-sound" title="Toggle Sound">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <button class="btn-icon" id="btn-theme" title="Switch Theme">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
        </div>
    </header>

    <!-- MAIN CARD -->
    <main class="card" id="main-card">
        
        <!-- MODE TABS -->
        <div class="tabs-container" id="mode-container" data-mode="normal">
            <div class="tab-indicator"></div>
            <button class="tab-btn active" data-target="normal">Number</button>
            <button class="tab-btn" data-target="wheel">Wheel</button>
            <button class="tab-btn" data-target="time">Time</button>
        </div>

        <!-- SHARED CONFIGURATION (For Number & Wheel) -->
        <section class="config-section" id="shared-config">
            
            <div class="input-mode-switch">
                <button id="mode-simple" class="link-btn active">Simple Range</button>
                <span>|</span>
                <button id="mode-advanced" class="link-btn">Custom Input</button>
            </div>

            <!-- SIMPLE INPUTS (Min/Max) -->
            <div id="input-group-simple" class="inputs-row">
                <div class="input-wrapper">
                    <label class="input-label" for="inp-min">Min</label>
                    <input type="number" id="inp-min" class="input-field" value="1">
                </div>
                <div class="input-wrapper">
                    <label class="input-label" for="inp-max">Max</label>
                    <input type="number" id="inp-max" class="input-field" value="10">
                </div>
            </div>

            <!-- ADVANCED INPUT (Textarea) -->
            <div id="input-group-advanced" class="input-wrapper hidden">
                <label class="input-label" for="inp-advanced">Custom List (e.g. 1-10, 15, 20-25)</label>
                <textarea id="inp-advanced" class="input-field" placeholder="1-5, 8, 11-15"></textarea>
            </div>

            <!-- OPT OUT TOGGLE -->
            <div class="checkbox-wrapper" id="opt-out-container" title="If checked, selected number will be removed from future spins">
                <label>
                    <input type="checkbox" id="chk-opt-out"> Remove picked number (Opt-out)
                </label>
            </div>
            
            <!-- Warning Message Container -->
            <div id="warning-container" class="msg-box warning-msg hidden">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                <span id="warning-text">One or more duplicate numbers detected</span>
            </div>

            <!-- Validation Message Container -->
            <div id="error-container" class="msg-box error-msg hidden">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="error-text">Error message goes here</span>
            </div>

            <!-- PRESETS -->
            <div class="presets-list" id="presets-list">
                <!-- JS populates chips here -->
            </div>

        </section>

        <!-- NORMAL MODE VIEW -->
        <section id="view-normal" class="action-area">
            <div class="result-box">
                <span class="result-title">Generated Result</span>
                <div id="result-display" class="result-value">--</div>
            </div>
            <button id="btn-generate" class="btn-primary">
                Generate Number
            </button>
        </section>

        <!-- WHEEL MODE VIEW -->
        <section id="view-wheel" class="action-area hidden">
            
            <!-- SPEED CONTROL -->
            <div class="speed-control-wrapper">
                <label class="input-label">Spin Duration</label>
                <div class="speed-options" id="speed-controls">
                    <button class="speed-btn" data-speed="slow">Long</button>
                    <button class="speed-btn active" data-speed="standard">Standard</button>
                    <button class="speed-btn" data-speed="fast">Short</button>
                </div>
            </div>

            <div class="wheel-stage">
                <!-- Pointer SVG -->
                <svg class="pointer" viewBox="0 0 24 32">
                    <path d="M12 32 L0 0 L24 0 Z" fill="#ef4444" />
                </svg>
                
                <!-- Center Hub -->
                <div class="wheel-center">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>
                </div>

                <!-- Wheel Container -->
                <div id="wheel-container" style="width:100%; height:100%;">
                    <!-- SVG Wheel Injected Here -->
                </div>
            </div>
            
            <div style="margin-bottom: 1rem;">
                 <span id="wheel-result-label" style="font-size: 1.5rem; font-weight: 800; display: block; min-height: 2rem;">Ready</span>
            </div>

            <div class="inputs-row">
                <button id="btn-spin" class="btn-primary">
                    Spin Wheel
                </button>
                <button id="btn-reset-wheel" class="btn-primary" style="background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border);">
                    Reset
                </button>
            </div>
        </section>

        <!-- TIME CONVERTER VIEW -->
        <section id="view-time" class="action-area hidden" style="margin-top: 0;">
            
            <!-- Time Inputs -->
            <div class="inputs-row" style="margin-bottom: 1.5rem;">
                <div class="input-wrapper">
                    <label class="input-label" for="inp-hours">Hours</label>
                    <input type="number" id="inp-hours" class="input-field" value="0" min="0">
                </div>
                <div class="input-wrapper">
                    <label class="input-label" for="inp-minutes">Minutes</label>
                    <input type="number" id="inp-minutes" class="input-field" value="0" min="0">
                </div>
            </div>

            <div class="result-box">
                <span class="result-title">Decimal Hours</span>
                <div id="time-result-display" class="result-value">0</div>
            </div>

            <div class="inputs-row">
                <button id="btn-copy-val" class="btn-primary" style="font-size: 0.95rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy Value
                </button>
                <button id="btn-copy-text" class="btn-primary" style="font-size: 0.95rem; background-color: var(--bg-card); color: var(--primary); border: 2px solid var(--primary);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Copy Text
                </button>
            </div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Message here</div>

</div>

<script>
    /**
     * 🛠️ APP CONFIGURATION
     */
    const CONFIG = {
        limits: { normal: 1000000, wheel: 100 }, 
        colors: [
            '#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', 
            '#f97316', '#f59e0b', '#10b981', '#06b6d4', 
            '#3b82f6', '#64748b'
        ],
        presets: [
            { label: '1-6', min: 1, max: 6 },
            { label: '1-10', min: 1, max: 10 },
            { label: '1-20', min: 1, max: 20 },
            { label: '1-50', min: 1, max: 50 },
            { label: '1-100', min: 1, max: 100 },
            { label: '0-1 (Coin)', min: 0, max: 1 },
        ],
        // Configuration for physics animation
        physics: {
            accelTime: 800,    // 0.8s to ramp up
            decelTime: 3500,   // 3.5s to ramp down
            maxSpeed: 720,     // Degrees per second
            durations: {
                slow: 5000,
                standard: 2500,
                fast: 1000
            }
        }
    };

    const STATE = {
        mode: 'normal', // 'normal' | 'wheel' | 'time'
        inputMode: 'simple', // 'simple' | 'advanced'
        
        // Data Source
        min: 1,
        max: 10,
        customString: "1-10",
        
        // Active Items (Array used for logic)
        items: [],
        
        // Opt Out
        optOut: false,

        sound: true,
        isSpinning: false,
        wheelRotation: 0,
        speed: 'standard',
        
        // Time State
        hours: 0,
        minutes: 0,
        totalHours: 0
    };

    const AUDIO = new (window.AudioContext || window.webkitAudioContext)();

    /**
     * 🖱️ DOM ELEMENTS
     */
    const els = {
        inputs: { 
            min: document.getElementById('inp-min'), 
            max: document.getElementById('inp-max'),
            advanced: document.getElementById('inp-advanced'),
            optOut: document.getElementById('chk-opt-out'),
            hours: document.getElementById('inp-hours'),
            minutes: document.getElementById('inp-minutes')
        },
        inputGroups: {
            simple: document.getElementById('input-group-simple'),
            advanced: document.getElementById('input-group-advanced')
        },
        modeSwitches: {
            simple: document.getElementById('mode-simple'),
            advanced: document.getElementById('mode-advanced')
        },
        sharedConfig: document.getElementById('shared-config'),
        presets: document.getElementById('presets-list'),
        tabs: document.querySelectorAll('.tab-btn'),
        tabContainer: document.getElementById('mode-container'),
        views: { 
            normal: document.getElementById('view-normal'), 
            wheel: document.getElementById('view-wheel'),
            time: document.getElementById('view-time') 
        },
        buttons: { 
            gen: document.getElementById('btn-generate'), 
            spin: document.getElementById('btn-spin'), 
            resetWheel: document.getElementById('btn-reset-wheel'),
            theme: document.getElementById('btn-theme'), 
            sound: document.getElementById('btn-sound'),
            copyVal: document.getElementById('btn-copy-val'),
            copyText: document.getElementById('btn-copy-text')
        },
        display: { 
            normal: document.getElementById('result-display'), 
            wheelLabel: document.getElementById('wheel-result-label'),
            time: document.getElementById('time-result-display')
        },
        wheel: document.getElementById('wheel-container'),
        error: { container: document.getElementById('error-container'), text: document.getElementById('error-text') },
        warning: { container: document.getElementById('warning-container'), text: document.getElementById('warning-text') },
        toast: document.getElementById('toast'),
        speedOpts: document.getElementById('speed-controls')
    };

    /**
     * ⚙️ INITIALIZATION
     */
    function init() {
        renderPresets();
        setupEventListeners();
        regenerateItems(); // Build initial array
        drawWheel();
        
        // Check OS Theme
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    }

    /**
     * 🎮 CONTROLLER & LOGIC
     */

    function setupEventListeners() {
        // App Mode Switching (Number / Wheel / Time)
        els.tabs.forEach(btn => {
            btn.addEventListener('click', () => switchAppMode(btn.dataset.target));
        });

        // Input Mode Switching (Simple / Advanced)
        els.modeSwitches.simple.addEventListener('click', () => switchInputMode('simple'));
        els.modeSwitches.advanced.addEventListener('click', () => switchInputMode('advanced'));

        // Opt Out Toggle
        els.inputs.optOut.addEventListener('change', (e) => {
            STATE.optOut = e.target.checked;
        });

        // Speed Control
        els.speedOpts.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(STATE.isSpinning) return;
                STATE.speed = e.target.dataset.speed;
                els.speedOpts.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
            });
        });

        // Data Inputs
        [els.inputs.min, els.inputs.max].forEach(input => {
            input.addEventListener('input', () => {
                regenerateItems();
            });
        });

        els.inputs.advanced.addEventListener('input', () => {
            regenerateItems();
        });

        // Time Inputs
        [els.inputs.hours, els.inputs.minutes].forEach(input => {
            input.addEventListener('input', calculateTime);
        });

        // Actions
        els.buttons.gen.addEventListener('click', generateNumber);
        els.buttons.spin.addEventListener('click', spinWheel);
        els.buttons.resetWheel.addEventListener('click', () => {
            regenerateItems();
            showToast("Wheel Reset");
        });

        els.buttons.copyVal.addEventListener('click', () => copyTime(false));
        els.buttons.copyText.addEventListener('click', () => copyTime(true));
        
        // Utility
        els.buttons.theme.addEventListener('click', toggleTheme);
        els.buttons.sound.addEventListener('click', toggleSound);
    }

    function switchAppMode(mode) {
        if (STATE.isSpinning) return;
        
        STATE.mode = mode;
        els.tabContainer.setAttribute('data-mode', mode);
        
        els.tabs.forEach(t => t.classList.toggle('active', t.dataset.target === mode));

        // Hide All
        Object.values(els.views).forEach(el => el.classList.add('hidden'));

        // Show Specific
        if (mode === 'time') {
            els.sharedConfig.classList.add('hidden');
            els.views.time.classList.remove('hidden');
        } else {
            els.sharedConfig.classList.remove('hidden');
            if (mode === 'normal') els.views.normal.classList.remove('hidden');
            if (mode === 'wheel') {
                els.views.wheel.classList.remove('hidden');
                drawWheel();
            }
        }
    }

    function switchInputMode(mode) {
        if(STATE.isSpinning) return;
        STATE.inputMode = mode;
        
        // Toggle UI Buttons
        els.modeSwitches.simple.classList.toggle('active', mode === 'simple');
        els.modeSwitches.advanced.classList.toggle('active', mode === 'advanced');

        // Toggle Input Fields
        els.inputGroups.simple.classList.toggle('hidden', mode !== 'simple');
        els.inputGroups.advanced.classList.toggle('hidden', mode !== 'advanced');

        // If switching to advanced for the first time, populate it with current simple range
        if (mode === 'advanced' && !els.inputs.advanced.value) {
            els.inputs.advanced.value = `${els.inputs.min.value}-${els.inputs.max.value}`;
        }

        regenerateItems();
    }

    // --- CORE DATA PARSING ---

    function parseAdvancedInput(str) {
        // Supported formats: "1-10", "1, 5, 8", "1-5, 10-15"
        const items = new Set();
        const parts = str.split(',');
        let hasDuplicates = false;
        
        for (let part of parts) {
            part = part.trim();
            if(!part) continue;

            if (part.includes('-')) {
                // Range
                const range = part.split('-').map(n => parseInt(n.trim()));
                if (range.length === 2 && !isNaN(range[0]) && !isNaN(range[1])) {
                    const start = Math.min(range[0], range[1]);
                    const end = Math.max(range[0], range[1]);
                    // Safety cap for ranges to prevent browser crash
                    if (end - start > 5000) return { error: "Range too large" }; 
                    
                    for (let i = start; i <= end; i++) {
                        if (items.has(i)) hasDuplicates = true;
                        items.add(i);
                    }
                }
            } else {
                // Single Number
                const num = parseInt(part);
                if (!isNaN(num)) {
                    if (items.has(num)) hasDuplicates = true;
                    items.add(num);
                }
            }
        }

        return { items: Array.from(items), error: null, hasDuplicates };
    }

    function regenerateItems() {
        if(STATE.isSpinning) return;

        let newItems = [];
        let isValid = true;
        let errorMsg = "";
        let showWarning = false;

        if (STATE.inputMode === 'simple') {
            const min = parseInt(els.inputs.min.value);
            const max = parseInt(els.inputs.max.value);
            
            if (isNaN(min) || isNaN(max)) {
                isValid = false; errorMsg = "Please enter valid numbers.";
            } else if (min > max) {
                isValid = false; errorMsg = "Min cannot be greater than Max.";
            } else {
                // Populate array
                if (max - min > 1000) {
                    newItems = null; // Signal that it's a pure math range
                    STATE.min = min;
                    STATE.max = max;
                } else {
                    for(let i=min; i<=max; i++) newItems.push(i);
                }
            }
        } else {
            // Advanced
            const result = parseAdvancedInput(els.inputs.advanced.value);
            
            if (result.error) {
                isValid = false; 
                errorMsg = result.error;
            } else {
                newItems = result.items;
                showWarning = result.hasDuplicates;
                
                if (newItems.length === 0) {
                    isValid = false; errorMsg = "No valid numbers found.";
                }
            }
        }

        // VALIDATION & UI FEEDBACK
        els.error.container.classList.add('hidden');
        els.warning.container.classList.add('hidden');
        
        if (!isValid) {
            showError(errorMsg);
            STATE.items = [];
            els.buttons.gen.disabled = true;
            els.buttons.spin.disabled = true;
            return;
        }

        // Show Warning if needed
        if (showWarning) {
            els.warning.container.classList.remove('hidden');
        }

        // Enable buttons
        els.buttons.gen.disabled = false;
        els.buttons.spin.disabled = false;

        // Limit Checks for Wheel
        if (STATE.mode === 'wheel') {
            const count = newItems ? newItems.length : (STATE.max - STATE.min + 1);
            if (count > CONFIG.limits.wheel) {
                showError(`Wheel supports max ${CONFIG.limits.wheel} items (Current: ${count}).`);
                return;
            }
            if (count < 2) {
                showError("Wheel needs at least 2 items.");
                return;
            }
        }

        STATE.items = newItems;
        if (STATE.mode === 'wheel') drawWheel();
    }

    function showError(msg) {
        els.error.text.textContent = msg;
        els.error.container.classList.remove('hidden');
        els.buttons.gen.disabled = true;
        els.buttons.spin.disabled = true;
    }

    function renderPresets() {
        els.presets.innerHTML = '';
        CONFIG.presets.forEach(p => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.textContent = p.label;
            chip.onclick = () => {
                if(STATE.isSpinning) return;
                switchInputMode('simple');
                els.inputs.min.value = p.min;
                els.inputs.max.value = p.max;
                regenerateItems();
            };
            els.presets.appendChild(chip);
        });
    }

    function getSecureRandomItem(items) {
        if (!items) {
            // Range based fallback
            const range = STATE.max - STATE.min + 1;
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return Math.floor((array[0] / (0xFFFFFFFF + 1)) * range) + STATE.min;
        }
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        const idx = Math.floor((array[0] / (0xFFFFFFFF + 1)) * items.length);
        return items[idx];
    }

    /**
     * 🔒 GLOBAL LOCK (To prevent interaction during spin)
     */
    function toggleInteractions(enable) {
        const elementsToLock = [
            ...document.querySelectorAll('button'),
            ...document.querySelectorAll('input'),
            ...document.querySelectorAll('textarea'),
            ...document.querySelectorAll('.chip'),
            ...document.querySelectorAll('.tab-btn')
        ];

        elementsToLock.forEach(el => {
            if(enable) {
                el.disabled = false;
                el.classList.remove('disabled');
            } else {
                el.disabled = true;
                el.classList.add('disabled');
            }
        });
    }

    /**
     * 🎲 GENERATOR LOGIC
     */
    function generateNumber() {
        // If items is null, use min/max logic, else use array pick
        const target = getSecureRandomItem(STATE.items);
        
        toggleInteractions(false);
        els.display.normal.classList.remove('anim-pop');
        void els.display.normal.offsetWidth;

        let steps = 10;
        const interval = setInterval(() => {
            // Fake shuffle numbers
            const fake = STATE.items ? STATE.items[Math.floor(Math.random()*STATE.items.length)] : Math.floor(Math.random() * (STATE.max - STATE.min) + STATE.min);
            els.display.normal.textContent = fake;
            steps--;
            playTick(800 + (steps * 100));
            
            if (steps <= 0) {
                clearInterval(interval);
                els.display.normal.textContent = target;
                els.display.normal.classList.add('anim-pop');
                playWin();
                toggleInteractions(true);
            }
        }, 50);
    }

    /**
     * 🎡 WHEEL LOGIC
     */
    function drawWheel() {
        // If logic is range-based (too huge), we can't draw wheel
        if (!STATE.items || STATE.items.length === 0) {
            els.wheel.innerHTML = '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:var(--text-muted);">List empty or too large</div>';
            return;
        }

        const items = STATE.items;
        const count = items.length;
        const sliceDeg = 360 / count;
        let svg = `<svg class="wheel-svg" viewBox="0 0 100 100" style="transform: rotate(${STATE.wheelRotation}deg);">`;
        
        for (let i = 0; i < count; i++) {
            const startAngle = i * sliceDeg;
            const endAngle = (i + 1) * sliceDeg;
            
            const x1 = 50 + 50 * Math.cos(Math.PI * (startAngle - 90) / 180);
            const y1 = 50 + 50 * Math.sin(Math.PI * (startAngle - 90) / 180);
            const x2 = 50 + 50 * Math.cos(Math.PI * (endAngle - 90) / 180);
            const y2 = 50 + 50 * Math.sin(Math.PI * (endAngle - 90) / 180);
            
            const path = count === 1 
                ? `M 50 50 L 50 0 A 50 50 0 1 1 49.99 0 Z` 
                : `M 50 50 L ${x1} ${y1} A 50 50 0 0 1 ${x2} ${y2} Z`;

            const color = CONFIG.colors[i % CONFIG.colors.length];
            
            // Text
            const midAngle = startAngle + sliceDeg / 2;
            const tx = 50 + 38 * Math.cos(Math.PI * (midAngle - 90) / 180);
            const ty = 50 + 38 * Math.sin(Math.PI * (midAngle - 90) / 180);

            // Font size logic
            let fontSize = 4;
            if (count < 10) fontSize = 8;
            else if (count < 20) fontSize = 6;
            
            // Truncate text if too long
            let text = items[i].toString();
            if (text.length > 4 && count > 10) text = text.substring(0,3) + '..';

            svg += `<path d="${path}" fill="${color}" stroke="white" stroke-width="0.5" />`;
            if (count < 50) {
                svg += `<text x="${tx}" y="${ty}" fill="white" 
                        font-size="${fontSize}" 
                        font-weight="bold" text-anchor="middle" dominant-baseline="middle" 
                        transform="rotate(${midAngle}, ${tx}, ${ty})">${text}</text>`;
            }
        }
        svg += `</svg>`;
        els.wheel.innerHTML = svg;
    }

    function spinWheel() {
        if (STATE.isSpinning || !STATE.items || STATE.items.length < 2) return;
        
        STATE.isSpinning = true;
        toggleInteractions(false); // BLOCK ALL BUTTONS
        els.display.wheelLabel.textContent = "...";

        // Random Index
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        const winIndex = Math.floor((array[0] / (0xFFFFFFFF + 1)) * STATE.items.length);
        const targetValue = STATE.items[winIndex];

        const count = STATE.items.length;
        const sliceDeg = 360 / count;

        // Physics Setup
        const maxSpeed = CONFIG.physics.maxSpeed; 
        const accelTime = CONFIG.physics.accelTime / 1000; 
        const decelTime = CONFIG.physics.decelTime / 1000;
        const spinDuration = CONFIG.physics.durations[STATE.speed] / 1000;
        
        const accelDist = 0.5 * maxSpeed * accelTime;
        const decelDist = (1/3) * maxSpeed * decelTime;
        const minRotation = accelDist + decelDist;

        // Target Angle
        const baseTargetAngle = winIndex * sliceDeg + (sliceDeg / 2);
        const drift = (Math.random() - 0.5) * (sliceDeg * 0.8);
        const finalTargetAngle = baseTargetAngle + drift;

        const currentRot = STATE.wheelRotation % 360;
        let distToTarget = (360 - finalTargetAngle) - currentRot;
        while(distToTarget < 0) distToTarget += 360;

        const approxTotal = minRotation + (spinDuration * maxSpeed);
        let finalTotalRotation = distToTarget;
        while(finalTotalRotation < approxTotal) {
            finalTotalRotation += 360;
        }

        const constantDist = finalTotalRotation - accelDist - decelDist;
        const constantTime = constantDist / maxSpeed;

        const startRot = STATE.wheelRotation;
        let startTime = null;

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const t = (timestamp - startTime) / 1000;
            let currentDist = 0;

            if (t < accelTime) {
                const p = t / accelTime;
                currentDist = accelDist * (p * p);
            } 
            else if (t < accelTime + constantTime) {
                const t_const = t - accelTime;
                currentDist = accelDist + (maxSpeed * t_const);
            } 
            else if (t < accelTime + constantTime + decelTime) {
                const t_decel = t - (accelTime + constantTime);
                const p = t_decel / decelTime;
                const ease = 1 - Math.pow(1 - p, 3);
                currentDist = accelDist + constantDist + (decelDist * ease);
            } 
            else {
                // FINISH
                currentDist = finalTotalRotation;
                STATE.wheelRotation = startRot + finalTotalRotation;
                const svgEl = els.wheel.querySelector('svg');
                if(svgEl) svgEl.style.transform = `rotate(${STATE.wheelRotation}deg)`;
                
                // END LOGIC
                setTimeout(() => {
                    playWin();
                    els.display.wheelLabel.textContent = targetValue;
                    
                    // OPT OUT LOGIC
                    if (STATE.optOut) {
                        STATE.items.splice(winIndex, 1);
                        // Update UI to reflect changes if in advanced mode
                        if (STATE.inputMode === 'advanced') {
                            // Reconstruct string logic is complex, simpler to just draw wheel from state
                            // But user expects textarea update? Let's just update wheel for now to avoid complexity
                            // If items empty
                            if (STATE.items.length === 0) {
                                showToast("All items picked!");
                            } else {
                                drawWheel();
                                showToast(`Removed ${targetValue}`);
                            }
                        } else {
                            // Simple mode but we removed an item -> effectively becomes custom list
                            // But visual simple inputs (min/max) become invalid conceptually.
                            // We just redraw wheel.
                             if (STATE.items.length === 0) {
                                showToast("All items picked!");
                            } else {
                                drawWheel();
                                showToast(`Removed ${targetValue}`);
                            }
                        }
                    }

                    STATE.isSpinning = false;
                    toggleInteractions(true); // ENABLE BUTTONS
                }, 500);
                return;
            }

            STATE.wheelRotation = startRot + currentDist;
            const svgEl = els.wheel.querySelector('svg');
            if(svgEl) {
                svgEl.style.transition = 'none';
                svgEl.style.transform = `rotate(${STATE.wheelRotation}deg)`;
            }
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    }

    /**
     * ⏳ TIME CALCULATOR
     */
    function calculateTime() {
        const h = parseFloat(els.inputs.hours.value) || 0;
        const m = parseFloat(els.inputs.minutes.value) || 0;
        const total = h + (m / 60);
        const formatted = parseFloat(total.toFixed(4)); 
        STATE.totalHours = formatted;
        els.display.time.textContent = formatted;
    }

    function copyTime(withText) {
        const val = els.display.time.textContent;
        const textToCopy = withText ? `${val} hours` : val;
        
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            showToast(`Copied: "${textToCopy}"`);
        } catch (err) {
            showToast("Failed to copy");
        }
        document.body.removeChild(textArea);
    }

    // UTILS
    function toggleSound() {
        STATE.sound = !STATE.sound;
        els.buttons.sound.style.opacity = STATE.sound ? 1 : 0.5;
        showToast(STATE.sound ? "Sound On" : "Sound Off");
    }

    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    }

    function showToast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.add('show');
        setTimeout(() => els.toast.classList.remove('show'), 2500);
    }

    function playTick(freq) {
        if (!STATE.sound) return;
        if (AUDIO.state === 'suspended') AUDIO.resume();
        const osc = AUDIO.createOscillator();
        const gain = AUDIO.createGain();
        osc.connect(gain);
        gain.connect(AUDIO.destination);
        osc.type = 'triangle';
        osc.frequency.value = freq || 600;
        gain.gain.setValueAtTime(0.05, AUDIO.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, AUDIO.currentTime + 0.05);
        osc.start();
        osc.stop(AUDIO.currentTime + 0.05);
    }

    function playWin() {
        if (!STATE.sound) return;
        if (AUDIO.state === 'suspended') AUDIO.resume();
        const osc = AUDIO.createOscillator();
        const gain = AUDIO.createGain();
        osc.connect(gain);
        gain.connect(AUDIO.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, AUDIO.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, AUDIO.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, AUDIO.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, AUDIO.currentTime + 0.6);
        osc.start();
        osc.stop(AUDIO.currentTime + 0.6);
    }

    // BOOT
    init();

</script>

</body>
